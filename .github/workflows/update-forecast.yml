name: Daily Forecast Update
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance torch scikit-learn openpyxl pyreadstat requests
      - name: Run forecast update
        continue-on-error: true
        run: python update_forecast.py
      - name: Commit and push (always, daily heartbeat)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u +'%Y-%m-%d %H:%M:%S UTC' > data/_last_run.txt
          git add -A data/
          git commit -m "Automated forecast update $(date -u +'%Y-%m-%d')" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push
