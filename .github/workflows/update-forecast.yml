name: Daily Forecast Update

on:
  schedule:
    - cron: "0 6 * * *"  # Запуск каждый день в 6:00 UTC (9:00 по Москве)
  workflow_dispatch:      # Позволяет запустить вручную из интерфейса GitHub

permissions:
  contents: write         # Даём права на запись в репозиторий

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance torch scikit-learn openpyxl pyreadstat requests

      - name: Run forecast update
        run: python update_forecast.py
        env:
          # Секреты не нужны, так как скрипт работает с локальными файлами

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "Автоматическое обновление индекса $(date -u +'%Y-%m-%d')"
          git push